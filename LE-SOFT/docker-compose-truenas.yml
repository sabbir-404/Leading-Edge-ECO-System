# docker-compose-truenas.yml — LE-SOFT Multi-Service TrueNAS Enterprise Deployment Stack
# Deploy via TrueNAS Apps / Portainer Docker Compose UI at http://100.88.85.6

version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: lesoft-minio
    ports:
      - "8081:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: truenas_admin
      MINIO_ROOT_PASSWORD: Brown@8099
    command: server /data --console-address ":9001"
    restart: always

  nats:
    image: nats:latest
    container_name: lesoft-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: always

  portainer:
    image: portainer/portainer-ce:latest
    container_name: lesoft-portainer
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always

volumes:
  portainer_data:
