# docker-compose-truenas.yml — LE-SOFT Multi-Service TrueNAS Enterprise Deployment Stack
# Deploy via TrueNAS Apps / Portainer Docker Compose UI at http://100.88.85.6

version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: lesoft-minio
    ports:
      - "8081:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-truenas_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    restart: always

  nats:
    image: nats:latest
    container_name: lesoft-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: always

  portainer:
    image: portainer/portainer-ce:latest
    container_name: lesoft-portainer
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always

  connection-manager:
    image: node:20-alpine
    container_name: lesoft-connection-manager
    working_dir: /app
    volumes:
      - ./scripts/nas-connection-service.js:/app/nas-connection-service.js:ro
    command: sh -c "npm install -g pg && NODE_PATH=$$(npm root -g) node /app/nas-connection-service.js"
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      ADMIN_SECRET: ${CONNECTION_MANAGER_ADMIN_SECRET:?Error: CONNECTION_MANAGER_ADMIN_SECRET must be set and cannot use default}
      PGHOST: ${PGHOST:-127.0.0.1}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-lesoft}
      PGUSER: ${PGUSER:-nas_connection_service}
      PGPASSWORD: ${PGPASSWORD:?Error: PGPASSWORD must be set for durable client registry persistence}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: always

  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: lesoft-postgrest
    ports:
      # Bound to internal Tailscale / localhost interface; protected by JWT verification
      - "127.0.0.1:3001:3001"
    environment:
      PGRST_DB_URI: "postgres://${TRUENAS_AUTHENTICATOR_USER:-authenticator}:${TRUENAS_AUTHENTICATOR_PASSWORD}@host.docker.internal:5432/lesoft"
      PGRST_DB_SCHEMAS: "public"
      # Secure anon role with zero access to sensitive tables (users, orders, finance, payroll)
      PGRST_DB_ANON_ROLE: "web_anon"
      PGRST_JWT_SECRET: ${TRUENAS_POSTGREST_JWT_SECRET:?Error: TRUENAS_POSTGREST_JWT_SECRET must be set for token verification}
      PGRST_SERVER_PORT: 3001
      PGRST_LOG_LEVEL: "warn"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  nas-pull-worker:
    image: node:20-alpine
    container_name: lesoft-nas-pull-worker
    working_dir: /app
    volumes:
      - ${TRUENAS_WORKER_SCRIPT:-./scripts/nas-pull-replication-worker.cjs}:/app/nas-pull-replication-worker.cjs:ro
      - ${TRUENAS_STORAGE_MOUNT:-/mnt/data_pool/lesoft/lesoft-storage/uploads}:/data/uploads
    command: sh -c "npm install -g pg @supabase/supabase-js && NODE_PATH=$$(npm root -g) node --experimental-websocket /app/nas-pull-replication-worker.cjs --daemon"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TRUENAS_PG_HOST: ${TRUENAS_PG_HOST:-host.docker.internal}
      TRUENAS_PG_PORT: ${TRUENAS_PG_PORT:-5432}
      TRUENAS_PG_DATABASE: ${TRUENAS_PG_DATABASE:-lesoft}
      TRUENAS_PG_USER: ${TRUENAS_PG_USER:-nas_replicator}
      TRUENAS_PG_PASSWORD: ${TRUENAS_PG_PASSWORD}
      TRUENAS_STORAGE_PATH: /data/uploads
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_REPLICATION_KEY: ${SUPABASE_REPLICATION_KEY}
      REPLICATION_INTERVAL_MS: ${REPLICATION_INTERVAL_MS:-15000}
      PRUNE_CLOUD_AFTER_NAS_CONFIRMATION: ${PRUNE_CLOUD_AFTER_NAS_CONFIRMATION:-false}
    restart: always

volumes:
  portainer_data:
