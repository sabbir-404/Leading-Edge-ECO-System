# docker-compose-truenas.yml — LE-SOFT Multi-Service TrueNAS Enterprise Deployment Stack
# Deploy via TrueNAS Apps / Portainer Docker Compose UI at http://100.88.85.6

version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: lesoft-minio
    ports:
      - "8081:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-truenas_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    restart: always

  nats:
    image: nats:latest
    container_name: lesoft-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: always

  portainer:
    image: portainer/portainer-ce:latest
    container_name: lesoft-portainer
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always

  connection-manager:
    image: node:20-alpine
    container_name: lesoft-connection-manager
    working_dir: /app
    volumes:
      - ./scripts/nas-connection-service.js:/app/nas-connection-service.js:ro
    command: sh -c "npm install -g pg && NODE_PATH=$$(npm root -g) node /app/nas-connection-service.js"
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      ADMIN_SECRET: ${CONNECTION_MANAGER_ADMIN_SECRET:?Error: CONNECTION_MANAGER_ADMIN_SECRET must be set and cannot use default}
      PGHOST: ${PGHOST:-127.0.0.1}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-lesoft}
      PGUSER: ${PGUSER:-nas_connection_service}
      PGPASSWORD: ${PGPASSWORD:?Error: PGPASSWORD must be set for durable client registry persistence}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: always

volumes:
  portainer_data:
