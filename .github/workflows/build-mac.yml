name: Build & Publish macOS

on:
  push:
    branches:
      - main-mac
      - main-windows
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v'
        required: true
        default: '1.7.0'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: LE-SOFT

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: LE-SOFT/package-lock.json

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Install Native Modules for Electron
        run: |
          if [ -d "node_modules/cpu-features" ]; then
            node -e "const fs=require('fs'), cp=require('child_process'); fs.writeFileSync('node_modules/cpu-features/buildcheck.gypi', cp.execSync('node buildcheck.js', {cwd: 'node_modules/cpu-features'}));"
          fi
          npx electron-builder install-app-deps

      - name: Build macOS Release
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish macOS Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.event.inputs.version || '' }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${RELEASE_VERSION:-}" ]]; then
            tag="v${RELEASE_VERSION}"
          else
            pkgVersion=$(node -p "require('./package.json').version")
            tag="v${pkgVersion}"
          fi

          title="LE-SOFT ${tag#v}"
          notes="LE-SOFT ${tag#v} release."

          if ! gh release view "$tag" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$RELEASE_REPO" --target "$GITHUB_SHA" --title "$title" --notes "$notes" || true
          fi

          gh release upload "$tag" \
            release/*.dmg \
            release/*.zip \
            release/latest-mac.yml \
            --repo "$RELEASE_REPO" \
            --clobber

          gh release edit "$tag" --draft=false --repo "$RELEASE_REPO" || true

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LESOFT-macOS
          path: |
            LE-SOFT/release/*.dmg
            LE-SOFT/release/*.zip
            LE-SOFT/release/latest-mac.yml
          if-no-files-found: warn
